<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antonio — Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1A1A1A;
    --bg-elevated: #303030;
    --line: #454545;
    --ink: #FFFFFF;
    --ink-muted: #bebebe;
    --accent: #2bd5c4;
    --accent-dim: #00403a;
    --accent-mint: #c9f2ed;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 64px 20px 100px;
  }

  .page {
    width: 100%;
    max-width: 620px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 40px;
  }

  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--accent-dim) 0%, var(--bg) 72%);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    position: relative;
  }

  .avatar::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent) 60%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .6;
  }

  .avatar img {
    width: 58%;
    height: auto;
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .hero p {
    color: var(--ink-muted);
    font-size: 14px;
    margin: 0;
    max-width: 380px;
    line-height: 1.5;
  }

  .stat-row {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  .stat-row span.dot { color: var(--accent-dim); }

  .search-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  .search-wrap input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 13px 16px 13px 38px;
    outline: none;
    transition: border-color .15s ease;
  }

  .search-wrap input::placeholder { color: #57657A; }
  .search-wrap input:focus { border-color: var(--accent-dim); }

  .search-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--ink-muted);
  }

  .category { margin-bottom: 28px; }

  .category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }

  .category-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .category-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chevron {
    width: 9px;
    height: 9px;
    border-right: 1.5px solid var(--ink-muted);
    border-bottom: 1.5px solid var(--ink-muted);
    transform: rotate(45deg);
    transition: transform .18s ease;
  }

  .category.collapsed .chevron { transform: rotate(-45deg); }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
    max-height: 2000px;
    transition: max-height .25s ease;
  }

  .category.collapsed .link-list { max-height: 0; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }

  .link-row:hover {
    background: var(--bg-elevated);
    border-color: var(--line);
    transform: translateX(2px);
  }

  .link-row .idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--accent-dim);
    width: 20px;
    flex-shrink: 0;
  }

  .link-row .label {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }

  .link-row .desc {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 400;
    display: block;
    margin-top: 1px;
  }

  .link-row .arrow {
    font-size: 13px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }

  .link-row:hover .arrow { color: var(--accent); }

  .empty-state {
    text-align: center;
    color: var(--ink-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: #4A5568;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
  }
</style>
</head>

const categoriesEl = document.getElementById('categories');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const statRow = document.getElementById('statRow');

function totalLinks() {
  return DATA.reduce((sum, c) => sum + c.links.length, 0);
}

statRow.innerHTML = `<span>${DATA.length} categorías</span><span class="dot">·</span><span>${totalLinks()} enlaces</span>`;

function render(filter = '') {
  categoriesEl.innerHTML = '';
  const q = filter.trim().toLowerCase();
  let anyVisible = false;

  DATA.forEach((cat, ci) => {
    const filtered = q
      ? cat.links.filter(l =>
          l.label.toLowerCase().includes(q) ||
          (l.desc && l.desc.toLowerCase().includes(q))
        )
      : cat.links;

    if (filtered.length === 0) return;
    anyVisible = true;

    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.dataset.index = ci;

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `
      <h2>${cat.name}</h2>
      <div class="count">${String(filtered.length).padStart(2,'0')}<span class="chevron"></span></div>
    `;
    head.addEventListener('click', () => {
      catEl.classList.toggle('collapsed');
    });

    const list = document.createElement('div');
    list.className = 'link-list';

    filtered.forEach((l, i) => {
      const a = document.createElement('a');
      a.className = 'link-row';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="label">${l.label}${l.desc ? `<span class="desc">${l.desc}</span>` : ''}</span>
        <span class="arrow">→</span>
      `;
      list.appendChild(a);
    });

    catEl.appendChild(head);
    catEl.appendChild(list);
    categoriesEl.appendChild(catEl);
  });

  emptyState.style.display = anyVisible ? 'none' : 'block';
}

searchInput.addEventListener('input', (e) => render(e.target.value));

render();
</script>
