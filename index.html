<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISEG CORP — Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #00403a;
    --bg-deep: #002e29;
    --card: #FFFFFF;
    --card-ink: #1A1A1A;
    --card-muted: #6b6b6b;
    --line: rgba(255,255,255,0.14);
    --ink: #FFFFFF;
    --ink-muted: #c9f2ed;
    --accent: #2bd5c4;
    --mint: #c9f2ed;
    --radius: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  *:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 90px;
    position: relative;
    overflow-x: hidden;
  }

  /* dot-grid backdrop: nods to spreadsheets/dashboards without being literal */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 0%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  .page {
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Header ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 36px;
  }

  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--mint) 0%, #FFFFFF 72%);
    border: 1px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.35);
  }

  .avatar::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent), var(--mint) 60%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .7;
  }

  .avatar img {
    width: 58%;
    height: auto;
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .hero p {
    color: var(--ink-muted);
    font-size: 13px;
    margin: 0;
    max-width: 380px;
    line-height: 1.5;
  }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }

  .stat-row .n {
    color: var(--accent);
    font-weight: 600;
  }

  .stat-row span.dot { opacity: .4; }

  /* ---------- Search ---------- */
  .search-wrap {
    position: relative;
    margin-bottom: 24px;
  }

  .search-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 14px 16px 14px 40px;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }

  .search-wrap input::placeholder { color: rgba(255,255,255,0.4); }
  .search-wrap input:focus { border-color: var(--accent); background: rgba(255,255,255,0.09); }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: rgba(255,255,255,0.5);
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 26px;
    scrollbar-width: none;
    mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }

  .tab .n {
    opacity: .6;
    margin-left: 4px;
  }

  .tab:hover {
    border-color: rgba(255,255,255,0.35);
    color: var(--ink);
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #002e29;
    font-weight: 600;
  }

  /* ---------- Card grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    text-decoration: none;
    color: var(--card-ink);
    display: flex;
    flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative;
    overflow: hidden;
    animation: cardIn .45s cubic-bezier(.16,.84,.44,1) backwards;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px -12px rgba(0,0,0,0.35);
  }

  .card .content {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card .idx {
    font-size: 10px;
    color: var(--card-muted);
    letter-spacing: 0.08em;
    opacity: .7;
  }

  .card .label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }

  .card .desc {
    font-size: 11.5px;
    color: var(--card-muted);
    line-height: 1.4;
  }

  .card .arrow {
    align-self: flex-end;
    margin-top: 16px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--mint);
    color: #00403a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: background .15s ease, transform .15s ease;
  }

  .card:hover .arrow {
    background: var(--accent);
    transform: translate(2px, -2px);
  }

  .empty-state {
    text-align: center;
    color: var(--ink-muted);
    font-size: 13px;
    padding: 50px 0;
    display: none;
  }

  footer {
    text-align: center;
    margin-top: 44px;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
</style>
</head>

/* ========================================================= */

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const statRow = document.getElementById('statRow');

let activeIndex = 0; // -1 = "Todos"

function totalLinks() {
  return DATA.reduce((sum, c) => sum + c.links.length, 0);
}

statRow.innerHTML = `<span><span class="n">${DATA.length}</span> categorías</span><span class="dot">·</span><span><span class="n">${totalLinks()}</span> enlaces</span>`;

function renderTabs() {
  tabsEl.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'tab' + (activeIndex === -1 ? ' active' : '');
  allTab.innerHTML = `Todos <span class="n">${totalLinks()}</span>`;
  allTab.addEventListener('click', () => { activeIndex = -1; renderTabs(); render(searchInput.value); });
  tabsEl.appendChild(allTab);

  DATA.forEach((cat, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (activeIndex === i ? ' active' : '');
    tab.innerHTML = `${cat.name} <span class="n">${cat.links.length}</span>`;
    tab.addEventListener('click', () => { activeIndex = i; renderTabs(); render(searchInput.value); });
    tabsEl.appendChild(tab);
  });
}

function render(filter = '') {
  gridEl.innerHTML = '';
  const q = filter.trim().toLowerCase();
  let anyVisible = false;

  const cats = activeIndex === -1 ? DATA : [DATA[activeIndex]];

  cats.forEach(cat => {
    const filtered = q
      ? cat.links.filter(l =>
          l.label.toLowerCase().includes(q) ||
          (l.desc && l.desc.toLowerCase().includes(q))
        )
      : cat.links;

    filtered.forEach((l, i) => {
      anyVisible = true;
      const a = document.createElement('a');
      a.className = 'card';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.animationDelay = `${Math.min(i, 10) * 35}ms`;
      a.innerHTML = `
        <div class="content">
          <span class="idx">${cat.name.toUpperCase()}</span>
          <span class="label">${l.label}</span>
          ${l.desc ? `<span class="desc">${l.desc}</span>` : ''}
        </div>
        <span class="arrow">→</span>
      `;
      gridEl.appendChild(a);
    });
  });

  emptyState.style.display = anyVisible ? 'none' : 'block';
}

searchInput.addEventListener('input', (e) => render(e.target.value));

renderTabs();
render();
</script>
