<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antonio — Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1A1A1A;
    --bg-elevated: #303030;
    --line: #454545;
    --ink: #FFFFFF;
    --ink-muted: #bebebe;
    --accent: #2bd5c4;
    --accent-dim: #00403a;
    --accent-mint: #c9f2ed;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 64px 20px 100px;
  }

  .page {
    width: 100%;
    max-width: 620px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 40px;
  }

  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--accent-dim) 0%, var(--bg) 72%);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    position: relative;
  }

  .avatar::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent) 60%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .6;
  }

  .avatar img {
    width: 58%;
    height: auto;
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .hero p {
    color: var(--ink-muted);
    font-size: 14px;
    margin: 0;
    max-width: 380px;
    line-height: 1.5;
  }

  .stat-row {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  .stat-row span.dot { color: var(--accent-dim); }

  .search-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  .search-wrap input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 13px 16px 13px 38px;
    outline: none;
    transition: border-color .15s ease;
  }

  .search-wrap input::placeholder { color: #57657A; }
  .search-wrap input:focus { border-color: var(--accent-dim); }

  .search-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--ink-muted);
  }

  .category { margin-bottom: 28px; }

  .category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }

  .category-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .category-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chevron {
    width: 9px;
    height: 9px;
    border-right: 1.5px solid var(--ink-muted);
    border-bottom: 1.5px solid var(--ink-muted);
    transform: rotate(45deg);
    transition: transform .18s ease;
  }

  .category.collapsed .chevron { transform: rotate(-45deg); }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
    max-height: 2000px;
    transition: max-height .25s ease;
  }

  .category.collapsed .link-list { max-height: 0; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }

  .link-row:hover {
    background: var(--bg-elevated);
    border-color: var(--line);
    transform: translateX(2px);
  }

  .link-row .idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--accent-dim);
    width: 20px;
    flex-shrink: 0;
  }

  .link-row .label {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }

  .link-row .desc {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 400;
    display: block;
    margin-top: 1px;
  }

  .link-row .arrow {
    font-size: 13px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }

  .link-row:hover .arrow { color: var(--accent); }

  .empty-state {
    text-align: center;
    color: var(--ink-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: #4A5568;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <div class="avatar"><img src="data:image/png;base64,__TU_LOGO_EN_BASE64_AQUI__" alt="ISEG"></div>
    <h1>ISEG CORP</h1>
    <p>Apps y dashboards en un solo lugar.</p>
    <div class="stat-row" id="statRow"></div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar un enlace…" autocomplete="off">
  </div>

  <div id="categories"></div>

  <div class="empty-state" id="emptyState">— sin resultados —</div>

  <footer>ISEG CORP&nbsp; · &nbsp;35 ENLACES&nbsp; · &nbsp;EDITA EL ARRAY "DATA" PARA PERSONALIZAR</footer>

</div>

<script>
/* =========================================================
   EDITA AQUÍ TUS LINKS
   Cada categoría es un objeto con: name, links[]
   Cada link: { label, desc (opcional), url }
   ========================================================= */
const DATA = [
  {
    name: "Apps de Lima",
    links: [
      { label: "App de compras", desc: "compras-taxi-nuevos ingresos", url: "https://www.appsheet.com/start/933e43a4-5a1c-4917-bf63-3716fb7e40f3" },
      { label: "App de RQ", desc: "Requerimiento de personal", url: "https://www.appsheet.com/start/9264630a-8d00-4603-abc5-1f0c40cecb88" },
      { label: "App de Incidencias", desc: "Incidencias de Lima", url: "https://www.appsheet.com/start/a3101b93-774b-4e81-8300-9eee5170c1ed" },
      { label: "App de Penalidad", desc: "Penalidad registra Kam", url: "https://www.appsheet.com/start/f300a428-a63f-4e8a-b70d-31da4509dc4d" },
      { label: "App de Reconocimientos", desc: "RC registra Kam", url: "https://www.appsheet.com/start/6278b92c-d242-498b-b535-27ce8832b8ef" },
      { label: "App de Vacaciones", desc: "Registra Kam o Jop", url: "https://www.appsheet.com/start/bc87d071-ab35-42bc-8b4d-6cdb82795757" },
      { label: "App de Guillerminos", desc: "Registra el proveedor", url: "https://www.appsheet.com/start/9e81cb5e-7475-4509-a592-4008f6d0a109" },
    ]
  },
  {
    name: "Apps de Provincia",
    links: [
      { label: "App de compras", desc: "Compras", url: "https://www.appsheet.com/start/0bcf5181-d54b-4a2f-ae2c-982945157615" },
      { label: "App de RQ", desc: "Requerimiento de personal", url: "https://www.appsheet.com/start/9d958223-99cc-4545-b8fd-4048b5a3a551" },
      { label: "App de Incidencia", desc: "Incidencias de Provincia", url: "https://www.appsheet.com/start/c4a8afca-2fba-448b-a17c-a6d6740b5d65" },
    ]
  },
  {
    name: "Dashboard",
    links: [
      { label: "Asistencia", desc: "Marcación de colaboradores", url: "https://app.powerbi.com/view?r=eyJrIjoiNmJhM2MxZDUtZjUwYS00YmQ0LThhYzktNDQ4ZmU3OTZlZDhhIiwidCI6IjAxZjUzYzY3LTU5NWItNDUwMS05OWZhLWI5MGMzMjU4YjM4NCIsImMiOjR9" },
      { label: "Compras", desc: "Descando-Turnos-horas", url: "https://app.powerbi.com/view?r=eyJrIjoiYTIyNDBiYTktMDk1Ny00M2I1LTg0ZTQtYmUxOWVjOGYwYzJlIiwidCI6IjAxZjUzYzY3LTU5NWItNDUwMS05OWZhLWI5MGMzMjU4YjM4NCIsImMiOjR9" },
      { label: "Reconocimiento-Penalidad", desc: "RC-Penalidad", url: "https://app.powerbi.com/view?r=eyJrIjoiZDAyMzVlN2YtNmY1MC00ZjBkLTlhZTQtZDFlMWQ2ZmM0ZTQ1IiwidCI6IjAxZjUzYzY3LTU5NWItNDUwMS05OWZhLWI5MGMzMjU4YjM4NCIsImMiOjR9" },
      { label: "RQ", desc: "Requerimiento de personal", url: "https://app.powerbi.com/view?r=eyJrIjoiOGY4Njk2ZjMtNGVlYy00MDg0LWJkZjQtZTVjYmFhZWQ4ZGRhIiwidCI6IjAxZjUzYzY3LTU5NWItNDUwMS05OWZhLWI5MGMzMjU4YjM4NCIsImMiOjR9" },
      { label: "Taxis", desc: "Demanda de movilidad", url: "#" },
    ]
  },
];

/* ========================================================= */

const categoriesEl = document.getElementById('categories');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const statRow = document.getElementById('statRow');

function totalLinks() {
  return DATA.reduce((sum, c) => sum + c.links.length, 0);
}

statRow.innerHTML = `<span>${DATA.length} categorías</span><span class="dot">·</span><span>${totalLinks()} enlaces</span>`;

function render(filter = '') {
  categoriesEl.innerHTML = '';
  const q = filter.trim().toLowerCase();
  let anyVisible = false;

  DATA.forEach((cat, ci) => {
    const filtered = q
      ? cat.links.filter(l =>
          l.label.toLowerCase().includes(q) ||
          (l.desc && l.desc.toLowerCase().includes(q))
        )
      : cat.links;

    if (filtered.length === 0) return;
    anyVisible = true;

    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.dataset.index = ci;

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `
      <h2>${cat.name}</h2>
      <div class="count">${String(filtered.length).padStart(2,'0')}<span class="chevron"></span></div>
    `;
    head.addEventListener('click', () => {
      catEl.classList.toggle('collapsed');
    });

    const list = document.createElement('div');
    list.className = 'link-list';

    filtered.forEach((l, i) => {
      const a = document.createElement('a');
      a.className = 'link-row';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="label">${l.label}${l.desc ? `<span class="desc">${l.desc}</span>` : ''}</span>
        <span class="arrow">→</span>
      `;
      list.appendChild(a);
    });

    catEl.appendChild(head);
    catEl.appendChild(list);
    categoriesEl.appendChild(catEl);
  });

  emptyState.style.display = anyVisible ? 'none' : 'block';
}

searchInput.addEventListener('input', (e) => render(e.target.value));

render();
</script>

</body>
</html>
